name: paper1-public
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - r-base=4.5
  - c-compiler
  - cxx-compiler
  - fortran-compiler
  - make
  - cmake
  - pkg-config
  - zlib
  - libcurl
  - openssl
  - libxml2
  - freetype
  - fontconfig
  - harfbuzz
  - fribidi
  - pip:
      - numpy==2.2.6
      - pandas==2.2.3
      - scipy==1.15.3
      - h5py==3.13.0
      - openpyxl==3.1.5
      - matplotlib==3.10.1
      - scikit-learn>=1.4,<2
      - threadpoolctl>=3,<4
      - scrublet>=0.2.3,<0.3
